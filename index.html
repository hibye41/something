<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>New gardens - an electronic music project</title>
  <meta name="description" content="New gardens personal website.">
  <link rel="canonical" href="https://new-gardens.com/">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="icon" href="/favicon.ico" sizes="any">

  <!-- Social cards -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="New gardens">
  <meta property="og:title" content="New gardens — electronic music project">
  <meta property="og:description" content="The New gardens personal website.">
  <meta property="og:url" content="https://new-gardens.com/">
  <meta property="og:image" content="https://new-gardens.com/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="New gardens">
  <meta name="twitter:card" content="summary_large_image">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MusicGroup",
    "name": "New gardens",
    "url": "https://new-gardens.com/",
    "image": "https://new-gardens.com/img/hero.png",
    "genre": ["Electronic"],
    "sameAs": [
      "https://newgardens.bandcamp.com/",
      "https://musicbrainz.org/artist/[MBID]",
      "https://www.wikidata.org/wiki/[QID]",
      "https://www.discogs.com/artist/[ID]"
    ]
  }
  </script>

  <style>
    :root { --fg:#e8e6e1; --bg:#0d0d0d; --dim:#8a8a8a; }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--fg); }
    body {
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:1.75rem; padding:2rem 1.25rem;
      font:400 0.85rem/1.5 monospace, ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
      letter-spacing:0.04em;
    }
    img.hero {
      display:block; width:100%; max-width:620px; height:auto;
      border-radius:2px;
    }
    h1 {
      margin:0; font-size:0.85rem; font-weight:400; letter-spacing:0.14em;
      text-transform:none;
    }
    nav { display:flex; flex-wrap:wrap; gap:0 1.1rem; justify-content:center; }
    a { color:var(--dim); text-decoration:none; border-bottom:1px solid transparent; }
    a:hover, a:focus-visible { color:var(--fg); border-bottom-color:var(--dim); }
    footer { color:#4a4a4a; font-size:0.7rem; }
  </style>
</head>
<body>

  <img class="hero" src="/img/hero.png" alt="New gardens" width="1600" height="1600">

  <h1>New gardens</h1>

  <nav>
    <a href="https://newgardens.bandcamp.com/">Bandcamp</a>
  </nav>

</body>
</html>
